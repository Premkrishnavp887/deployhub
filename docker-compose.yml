services:
  postgres:
    image: postgres:16-alpine
    container_name: deployhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deployhub
      POSTGRES_USER: deployhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deployhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub -d deployhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  deployhub_pgdata:
